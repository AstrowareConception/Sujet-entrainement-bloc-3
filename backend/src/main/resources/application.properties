spring.application.name=logitemp-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/logitemp}
spring.datasource.username=${DB_USER:logitemp}
spring.datasource.password=${DB_PASSWORD:logitemp_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:LOCAL_ONLY_CHANGE_ME__123456789012345678901234567890}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
